name: Starter CI
on:
  push:
    branches: [ main ]
  workflow_dispatch: 

    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Display runner details
        run: |
          echo "Workflow is running on ${{ runner.os }}"
          echo "more outputs from the CI"
      
      - name: install dependencies
        run: npm install
      
      - name: run app build
        run: npm run build
        
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Display runner details
        run: |
          echo "Workflow is running on ${{ runner.os }}"
          echo "more outputs from the CI"
          npm run install
          npm run test:e2e:playwright
      
